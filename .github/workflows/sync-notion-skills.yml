name: Sync Notion skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: sync-notion-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Infisical CLI
        run: npm install --global @infisical/cli@0.43.132

      - name: Export skills from Notion
        env:
          INFISICAL_DOMAIN: https://eu.infisical.com/api
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          NOTION_SKILLS_DATA_SOURCE_ID: ${{ vars.NOTION_SKILLS_DATA_SOURCE_ID }}
        run: |
          oidc_jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://eu.infisical.com" | jq -r .value)"
          echo "::add-mask::$oidc_jwt"
          infisical_token="$(infisical login --method=oidc-auth --machine-identity-id="$INFISICAL_IDENTITY_ID" --jwt="$oidc_jwt" --silent --plain)"
          echo "::add-mask::$infisical_token"
          infisical run \
            --token "$infisical_token" \
            --projectId 88269636-bd9f-447a-a1fd-b788edc4895e \
            --env prod \
            --silent \
            -- node scripts/sync-notion-skills.mjs

      - name: Validate generated skills
        run: npm run check

      - name: Commit generated changes
        run: |
          git add -A skills
          if git diff --staged --quiet; then
            echo "Skills are already current."
            exit 0
          fi
          git diff --staged --check
          GIT_AUTHOR_NAME="github-actions[bot]" \
          GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
          GIT_COMMITTER_NAME="github-actions[bot]" \
          GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git commit -m "chore: sync skills from Notion"
          git push origin HEAD:main
